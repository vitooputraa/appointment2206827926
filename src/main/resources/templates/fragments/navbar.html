<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Apap Medika'">Apap Medika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f9fc;
            color: #1e293b;
        }

        .navbar-apap {
            background-color: #5b4699;
        }

        .navbar-apap .navbar-brand {
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background-color: #e05263;
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .navbar-apap .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            margin-left: 1rem;
        }

        .navbar-apap .nav-link:hover,
        .navbar-apap .nav-link.active {
            color: #ffffff;
            font-weight: 700;
        }

        .card-apap {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        }

        .card-header-apap {
            background-color: #674ea7;
            color: #ffffff;
            border-radius: 12px 12px 0 0 !important;
            padding: 1rem 1.5rem;
        }

        .table-apap thead th {
            background-color: #674ea7;
            color: #ffffff;
            border: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-apap py-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <span class="brand-badge">A</span>
                <span>Apap Medika</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="mainNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'home'} ? 'active'" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'appointments'} ? 'active'"
                            th:href="@{/appointment/all}">Appointments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'doctors'} ? 'active'"
                            th:href="@{/doctor/all}">Doctors</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div th:fragment="scripts">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    </div>
</body>

</html>
