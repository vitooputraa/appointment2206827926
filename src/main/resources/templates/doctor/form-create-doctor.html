<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: header('New Doctor')}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container py-5">
        <h2 class="fw-bold text-center mb-4">New Doctor</h2>
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card card-apap p-4 p-md-5">
                    <form th:action="@{/doctor/create}" th:object="${doctorDTO}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Name</label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="Name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="Email"
                                    required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold d-block">Gender</label>
                                <div class="form-check form-check-inline mt-2">
                                    <input class="form-check-input" type="radio" th:field="*{gender}" th:value="false"
                                        id="genderMale" required>
                                    <label class="form-check-label" for="genderMale">Male</label>
                                </div>
                                <div class="form-check form-check-inline mt-2">
                                    <input class="form-check-input" type="radio" th:field="*{gender}" th:value="true"
                                        id="genderFemale">
                                    <label class="form-check-label" for="genderFemale">Female</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Specialization</label>
                                <select th:field="*{specialist}" class="form-select" required>
                                    <option value="" disabled selected>Choose specialization...</option>
                                    <option th:each="entry : ${specializations}" th:value="${entry.key}"
                                        th:text="${entry.value}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Years of Experience</label>
                                <input type="number" min="0" th:field="*{yearsOfExperience}" class="form-control"
                                    placeholder="Years of Experience" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Fee (Rp)</label>
                                <input type="number" min="0" th:field="*{fee}" class="form-control"
                                    placeholder="e.g. 300000" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex align-items-center gap-3 mb-2">
                                <label class="form-label fw-semibold mb-0">Schedule</label>
                                <button type="button" id="addScheduleBtn" class="btn btn-primary btn-sm px-3">Add
                                    Schedule</button>
                            </div>
                            <div id="scheduleContainer">
                                <div class="input-group mb-2 schedule-row" th:each="sched : *{schedules}">
                                    <select name="schedules" class="form-select" required>
                                        <option th:each="entry : ${days}" th:value="${entry.key}"
                                            th:text="${entry.value}" th:selected="${entry.key == sched}"></option>
                                    </select>
                                    <button type="button" class="btn btn-danger remove-schedule-btn">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">Submit</button>
                            <a th:href="@{/doctor/all}" class="btn btn-danger px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
    <script>
        $(document).ready(function () {
            const dayOptions = `
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
            <option value="7">Sunday</option>
        `;

            $('#addScheduleBtn').on('click', function () {
                const row = `
                <div class="input-group mb-2 schedule-row">
                    <select name="schedules" class="form-select" required>${dayOptions}</select>
                    <button type="button" class="btn btn-danger remove-schedule-btn">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            `;
                $('#scheduleContainer').append(row);
            });

            $(document).on('click', '.remove-schedule-btn', function () {
                if ($('.schedule-row').length > 1) {
                    $(this).closest('.schedule-row').remove();
                }
            });
        });
    </script>
</body>

</html>
