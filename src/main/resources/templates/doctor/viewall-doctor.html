<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: header('Doctors')}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold mb-0">Doctors</h2>
            <a th:href="@{/doctor/create}" class="btn btn-primary fw-semibold px-4">
                <i class="bi bi-plus-lg me-1"></i> Add Doctor
            </a>
        </div>
        <hr class="mb-4">

        <div class="card card-apap p-4">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label for="filterSpecialization" class="form-label fw-semibold">Filter Specialization</label>
                    <select id="filterSpecialization" class="form-select">
                        <option value="">All Specializations</option>
                        <option th:each="entry : ${specializations}" th:value="${entry.value}" th:text="${entry.value}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="filterDay" class="form-label fw-semibold">Filter Practice Day</label>
                    <select id="filterDay" class="form-select">
                        <option value="">All Days</option>
                        <option th:each="entry : ${days}" th:value="${entry.value}" th:text="${entry.value}"></option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table id="doctorTable" class="table table-hover align-middle table-apap">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>ID</th>
                            <th>Doctor</th>
                            <th>Specialization</th>
                            <th>Schedule (Days)</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="doc, iterStat : ${doctors}">
                            <td th:text="${iterStat.count}">1</td>
                            <td class="fw-semibold" th:text="${doc.id}">DR001</td>
                            <td th:text="${doc.name}">dr. Andi Saputra, Sp.A</td>
                            <td th:text="${helper.getSpecializationName(doc.specialist)}">Spesialis Anak</td>
                            <td th:text="${helper.formatSchedules(doc.schedules)}">Monday, Tuesday</td>
                            <td class="text-center">
                                <a th:href="@{/doctor/{id}(id=${doc.id})}"
                                    class="btn btn-primary btn-sm px-3">Detail</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
    <script>
        $(document).ready(function () {
            const table = $('#doctorTable').DataTable({
                columnDefs: [
                    { orderable: false, targets: [0, 5] }
                ]
            });

            $('#filterSpecialization').on('change', function () {
                const val = $.fn.dataTable.util.escapeRegex($(this).val());
                table.column(3).search(val ? '^' + val + '$' : '', true, false).draw();
            });

            $('#filterDay').on('change', function () {
                table.column(4).search($(this).val()).draw();
            });
        });
    </script>
</body>

</html>
