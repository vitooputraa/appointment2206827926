<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: header('Notification')}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card card-apap p-5 text-center">
                    <div class="mb-3 text-success">
                        <i class="bi bi-check-circle-fill" style="font-size: 3.5rem;"></i>
                    </div>
                    <h4 class="fw-bold mb-3" th:text="${message}">Berhasil memproses data.</h4>
                    <div class="mt-3">
                        <a th:href="@{${backUrl}}" class="btn btn-primary px-4 py-2 fw-semibold">Kembali</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
