<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: header('Search Patient')}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container py-5">
        <h2 class="fw-bold text-center mb-4">Search Patient</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-apap p-4 p-md-5">
                    <form th:action="@{/patient/search}" method="post">
                        <div class="mb-4">
                            <label for="nik" class="form-label fw-semibold">NIK</label>
                            <input type="text" id="nik" name="nik" class="form-control" placeholder="NIK" required>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Search</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
